[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automa"
version = "0.1.0"
description = "An AI agent that plays physical board and card games against you"
requires-python = ">=3.11"
# Pinned exactly: the reproduction guide must let a judge on a clean machine reach
# the same result, and a floating range does not guarantee that.
dependencies = [
    "anthropic==1.2.0",
    "google-genai==2.20.0",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.5",
]

[project.scripts]
automa-hello = "automa.scripts.hello_llm:main"
automa-show = "automa.trajectory.show:main"
automa-compile = "automa.scripts.compile_game:main"
automa-eval = "automa.eval.run:main"
automa-play = "automa.scripts.play:main"
automa-validate = "automa.scripts.validate_games:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
# Compiler output is held to the *contract* - the interface, self-play soundness, the
# sandbox - not to this project's house style. Failing the build over a model's import
# ordering would say nothing about whether the module plays the game correctly. Its real
# defects are caught by tests, which do run against it.
extend-exclude = ["src/automa/games/*_compiled.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
